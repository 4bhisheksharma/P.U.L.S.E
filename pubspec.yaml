name: pulse
description: "P.U.L.S.E - Personal Unseen Locker for Special Experience"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.4+4

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  share_plus: ^10.1.4
  audioplayers: ^6.5.1
  record: ^6.1.2
  uuid: ^4.5.1
  intl: ^0.19.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  url_launcher: ^6.3.2
  local_auth: ^3.0.1
  crypto: ^3.0.7
  lottie: ^3.3.3
  in_app_update: ^4.2.5
  permission_handler: ^11.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  rename_app: ^1.6.6
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - shorebird.yaml
